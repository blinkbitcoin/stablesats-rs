services:
  otel-agent:
    ports:
    - "4318:4318"
  kratos-pg:
    ports:
    - 5439:5432
  stablesats-pg:
    ports:
    - "5440:5432"
  bria:
    ports:
    - "2743:2743"
    - "2742:2742"
  bitcoind:
    ports:
      - "18443:18443"
  bitcoind-signer:
    ports:
      - "18543:18443"
  fulcrum:
    ports:
      - "50001:50001"

  # Keep service present for compose dependency resolution.
  # Tilt runs local stablesats via `stablesats-dev` and does not deploy this service.
  stablesats: {}

  # Even though the "!reset null" will remove the service, it does not remove the dependencies
  # Remove stablesats dependency from services that depend on it
  galoy: 
    depends_on: !override
      - apollo-router
      - bitcoind
      - bitcoind-signer
      - lnd1
      - lnd-outside-1
      - bria
      - fulcrum
      # - stablesats  
      - svix
      - hydra

  trigger: 
    depends_on: !override
      - lnd1
      - lnd-outside-1
      - bria
      - mongodb
      - redis
      # - stablesats
      - notifications
      - price
      - price-history
      - svix

  quickstart-test: 
    depends_on: !override
    - apollo-router
    - oathkeeper
    - kratos
    - galoy
    - trigger
    - redis
    - mongodb
    - mongodb-migrate
    - price
    - bitcoind
    - bitcoind-signer
    - lnd1
    - lnd-outside-1
    - bria
    - fulcrum
    # - stablesats
    - svix
    - hydra
