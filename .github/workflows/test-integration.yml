name: "Integration Tests"

on:
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4
      - name: Run the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v2
      - uses: actions/checkout@v3
      - name: Test demo failure reporting
        run: node --test .github/scripts/report-okex-demo-failure.test.cjs
      - name: Pull quickstart Docker images
        run: |
          docker compose --project-name blink-quickstart --project-directory vendor/blink-quickstart -f vendor/blink-quickstart/docker-compose.yml -f docker-compose.yml -f docker-compose.override.yml pull
      - name: Build project
        run: nix develop -c make build
      - name: Run integration tests
        env:
          BITFINEX_API_KEY: ${{ secrets.BITFINEX_API_KEY }}
          BITFINEX_SECRET_KEY: ${{ secrets.BITFINEX_SECRET_KEY }}
          GALOY_API_KEY: ${{ secrets.GALOY_API_KEY }}
        run: nix develop -c dev/bin/tilt-ci.sh
