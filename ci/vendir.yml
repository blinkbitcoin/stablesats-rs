apiVersion: vendir.k14s.io/v1alpha1
kind: Config

# Relative to ci/
directories:
- path: ../.github/workflows/vendor
  contents:
  - path: . # Copy this folder out to ..
    git:
      url: https://github.com/blinkbitcoin/concourse-shared.git
      ref: 89e63b63425a3e441e944a2fe1d1af96535f0ca1
    includePaths:
    - shared/actions/*
    excludePaths:
    - shared/actions/nodejs-*
    - shared/actions/tofu-*
    newRootPath: shared/actions

- path: ./vendor
  contents:
  - path: .
    git:
      url: https://github.com/blinkbitcoin/concourse-shared.git
      ref: 89e63b63425a3e441e944a2fe1d1af96535f0ca1
    includePaths:
    - shared/ci/**/*
    excludePaths:
    - shared/ci/**/nodejs-*
    - shared/ci/**/tofu-*
    newRootPath: shared/ci

- path: ../bin/vendor
  contents:
  - path: .
    git:
      url: https://github.com/blinkbitcoin/concourse-shared
      ref: 89e63b63425a3e441e944a2fe1d1af96535f0ca1
    includePaths:
    - shared/bin/**/*
    excludePaths:
    - shared/bin/**/nodejs-*
    - shared/bin/**/tofu-*
    newRootPath: shared/bin



